name: Worker PWA Feature CI

on:
  push:
    branches:
      - feat/pwa-worker-profile-v1
  pull_request:
    branches:
      - main
    paths:
      - 'lib/workerPwa.mjs'
      - 'lib/workerPwaServer.js'
      - 'app/api/pwa/**'
      - 'app/pwa/**'
      - 'app/w/**'
      - 'app/components/WorkerPwaInstall/**'
      - 'app/components/admin/WorkerIdentityEditor.js'
      - 'tests/worker-pwa.test.mjs'
      - 'package.json'
      - '.github/workflows/worker-pwa-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
